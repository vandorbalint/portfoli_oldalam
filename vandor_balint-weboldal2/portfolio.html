<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: "Quantico", sans-serif !important;
            letter-spacing: 3px;

        }

        video {
            border: 3px solid rgb(196, 196, 255);
            border-radius: 15px 50px;
            margin: 10px;
            display: block;
        }

        body {
            background: linear-gradient(#003572, #340088, #003f5c);
            color: white;
            padding: 25px;
            ;
        }


        hr {
            height: 3px;
            border: none;
            border-radius: 15px;
            margin: 30px 6px;

            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.5),
                    rgba(196, 196, 255, 0.9),
                    rgba(255, 255, 255, 0.5),
                    transparent);

            box-shadow:
                0 0 8px rgba(255, 255, 255, 0.35),
                0 0 18px rgba(130, 180, 255, 0.2);
        }

        img {
            border-radius: 15px 50px;
            border: 3px solid rgb(196, 196, 255);
            margin: 10px;
            display: block;
        }

        .menu {
            border-bottom: 5px solid #c29ffc;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .menu a {
            color: rgb(255, 0, 0);
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 25px;
            transition: 0.3s;
        }

        .menu a:hover {

            background: rgba(255, 255, 255, 0.20);
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);

        }

        .menu a.active {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
            color: white;
        }
    </style>
    <title>Portfolio</title>
</head>

    <article>
        <div class="menu">

        </div>

        <div style="display: flex; align-items: center; justify-content: space-between;">

        </div>
        <hr>

            <h2 style="text-align: left;margin-left: 32px; ">Showreel</h2>
            <video id="showreel" src="video/v1.mp4" width="640" height="360" controls></video>
        </div>
        <hr>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <img src="img/p02.png" width="640" height="360">
            <h2 style="text-align:  right; margin-right: 32px;">Kandaló bevilágitás</h2>
        </div>
        <hr>

            <h2 style="text-align: left; margin-left: 32px;">Tracking</h2>
            <video src="video/v2.mp4" width="640" height="360" controls></video>
        </div>
        <hr>
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <img src="img/p03.png" width="640" height="360">
            <h2 style="text-align: right; margin-right: 32px; ">Éjszakai ház</h2>
        </div>
        <hr>
        <div style="display: flex; align-items: center; justify-content: space-between;">
